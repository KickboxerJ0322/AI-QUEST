name: Deploy AI QUEST to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cloud-run-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every server-side module parses
        run: |
          node --check server.mjs
          node --check runner.mjs
          node --check navigation.mjs
          node --check agent.mjs
          node --check public/app.js
          node --check public/game.js
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run game engine tests
        run: npm test
      - name: Smoke test startup and HTTP health check
        run: |
          set -euo pipefail
          PORT=8099 NODE_ENV=production node server.mjs > /tmp/ai-quest-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8099/healthz | grep -q '"ok":true'; then READY=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then
            echo "::error::AI QUEST failed startup smoke test"
            cat /tmp/ai-quest-smoke.log
            exit 1
          fi
          echo "Smoke test passed"
      - name: Validate required repository variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_WIF_PROVIDER" || { echo "::error::Set repository variable GCP_WIF_PROVIDER"; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo "::error::Set repository variable GCP_SERVICE_ACCOUNT"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy source to Cloud Run
        run: |
          gcloud run deploy ai-quest \
            --project=jumpeicloud \
            --region=asia-northeast1 \
            --source=. \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --quiet
      - name: Print service URL
        run: gcloud run services describe ai-quest --project=jumpeicloud --region=asia-northeast1 --format='value(status.url)'
